{% extends "panel/base.html" %}
{% block panel %}
<div class="card">
<h3 style="margin-top:0">Excel'dan texnika yuklash</h3>
<p class="muted">.xlsx fayl: 1-qator sarlavha, ustunlar tartibi: <b>kod | nomi | ombor</b>. Mavjud kodlar yangilanadi, yangi omborlar avtomatik yaratiladi.</p>
<form method="post" enctype="multipart/form-data">{% csrf_token %}
<input type="file" name="file" accept=".xlsx" required>
<button type="submit">Yuklash</button>
</form>
<p><a class="l" href="{% url 'panel_equipment' %}">← Orqaga</a></p>
</div>
{% endblock %}
