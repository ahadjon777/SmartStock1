{% extends "inventory/base.html" %}
{% block title %}Panel — SmartStock{% endblock %}
{% block head %}<style>
.w{max-width:1100px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.grid4 .card{margin:0}
@media(min-width:700px){.grid4{grid-template-columns:repeat(4,1fr)}}
.num{font-size:1.9rem;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.tw{overflow-x:auto}
.sm{width:auto;padding:9px 16px;font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{width:auto;flex:1;min-width:120px;margin:0}
.muted{color:var(--m)}
.fld{margin-bottom:12px}
.fld label{display:block;color:var(--m);font-size:.9rem}
.fld ul{list-style:none;padding:0;margin:6px 0}
.fld li label{display:flex;gap:8px;align-items:center;color:var(--t)}
.fld li input{width:auto;margin:0}
.fld input[type=checkbox]{width:auto}
.errorlist{color:#ff8a8a;list-style:none;padding:0;margin:4px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;border:1px solid var(--line)}
.tag.o{color:#ffb86b;border-color:#ffb86b55}
.tag.g{color:var(--b);border-color:#00e0c655}
a.l{color:var(--b);text-decoration:none}
.tag.r{color:#ff8a8a;border-color:#ff8a8a55}
.tag.w{color:#ffb86b;border-color:#ffb86b55}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.kpi{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.kpi{grid-template-columns:repeat(6,1fr)}}
.kpi .card{margin:0;display:block;color:inherit;text-decoration:none}
.kpi a.card:hover{border-color:var(--a)}
.kpi .lbl{color:var(--t);font-size:.9rem;display:block}
.kpi .sub{color:var(--m);font-size:.78rem;margin-top:2px}
.num.o{background:none;color:#ffb86b;-webkit-text-fill-color:#ffb86b}
.num.z{background:none;color:var(--m);-webkit-text-fill-color:var(--m)}
.pbar{height:8px;border-radius:99px;background:#232a45;overflow:hidden;min-width:70px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.pbar.o>i{background:#ffb86b}
.attn{border-color:#ffb86b66;background:#ffb86b14}
.attn a{color:#ffb86b}
.live{color:var(--m);font-size:.82rem;margin:0 0 10px}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--b);margin-right:6px}
.sum{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
td small,.sub2{display:block;color:var(--m);font-size:.78rem}
th{color:var(--m);font-weight:600;font-size:.82rem;white-space:nowrap}
.cell-r{color:#ff8a8a}
.cell-o{color:#ffb86b}
h3.t{margin:0 0 6px;font-size:1rem}
</style>{% endblock %}
{% block content %}
<div class="tabs">
<a href="{% url 'panel_home' %}" class="{% if tab == 'home' %}on{% endif %}">Bosh sahifa</a>
<a href="{% url 'panel_out' %}" class="{% if tab == 'out' %}on{% endif %}">Tadbirda</a>
<a href="{% url 'panel_equipment' %}" class="{% if tab == 'equipment' %}on{% endif %}">Texnika</a>
{% if panel_admin %}
<a href="{% url 'panel_warehouses' %}" class="{% if tab == 'warehouses' %}on{% endif %}">Omborlar</a>
<a href="{% url 'panel_staff' %}" class="{% if tab == 'staff' %}on{% endif %}">Xodimlar</a>
{% endif %}
</div>
{% block panel %}{% endblock %}
{% if live %}<script>
/* Sahifa o'zi yangilanadi, lekin siz yozayotgan yoki belgilagan paytda emas */
(function () {
  function tick() {
    var busy = document.hidden || document.querySelector('input:focus,select:focus') || document.querySelector('input[type=checkbox]:checked');
    if (busy) { setTimeout(tick, 5000); return; }
    location.reload();
  }
  setTimeout(tick, 30000);
})();
</script>{% endif %}
{% endblock %}
