{% extends "inventory/base.html" %}
{% block title %}Biriktirish{% endblock %}
{% block content %}
<div class="card">
<b>Texnikalarni xodimga biriktirish</b>
<p style="color:var(--m)">Xodimga beriladigan texnikalar QR kodini skanerlang, F.I.Sh. kiriting va biriktiring.</p>
<div id="reader" style="width:100%"></div>
<button id="start" type="button">Kamerani yoqish</button>
</div>

<div class="card">
<label>Kod qo'shish (qo'lda)</label>
<input id="manual" placeholder="SS-00001">
<button id="add" type="button" style="margin-bottom:12px">Qo'shish</button>
<div id="list" style="color:var(--m)">Hali kod yo'q</div>
<label>Xodim F.I.Sh.</label>
<input id="holder" placeholder="Familiya Ism Sharif">
<button id="send" type="button">Biriktirish</button>
<div id="out"></div>
</div>

{% csrf_token %}
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;
const codes = [];
const out = document.getElementById('out');
function show(ok, text){ out.innerHTML = '<div class="msg '+(ok?'ok':'err')+'"></div>'; out.firstChild.textContent = text; }
function render(){ document.getElementById('list').textContent = codes.length ? codes.join(', ') + ' (' + codes.length + ' ta)' : 'Hali kod yo\'q'; }
function add(c){ c = c.trim(); if (c && !codes.includes(c)) { codes.push(c); render(); } }

document.getElementById('add').onclick = () => { add(document.getElementById('manual').value); document.getElementById('manual').value = ''; };

let scanner;
document.getElementById('start').onclick = () => {
  scanner = new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'}, {fps:10, qrbox:220}, add)
    .catch(() => show(false, 'Kameraga ruxsat berilmadi'));
};

document.getElementById('send').onclick = async () => {
  const res = await fetch("{% url 'assign_api' %}", {
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':csrf},
    body: JSON.stringify({codes: codes, holder: document.getElementById('holder').value})
  });
  const d = await res.json();
  let text = d.ok ? d.message : d.error;
  if (d.missing && d.missing.length) text += ' (topilmadi: ' + d.missing.join(', ') + ')';
  show(d.ok, text);
  if (d.ok) { codes.length = 0; render(); document.getElementById('holder').value = ''; }
};
</script>
{% endblock %}
